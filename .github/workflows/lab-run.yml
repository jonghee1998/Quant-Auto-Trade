name: lab-run
# 실험실 실행: 등록된 전략을 DB 데이터로 개발/검증 구간에 돌리고 experiments 표에 기록한다.
# AI가 아니라 코드만 실행한다. 홀드아웃(최종)은 여기서 돌리지 않는다.
run-name: "lab-run ${{ inputs.strategy }} ${{ inputs.period }}"
on:
  workflow_dispatch:
    inputs:
      strategy: { description: '전략 이름(quant/strategies REGISTRY)', required: true }
      period: { description: 'dev 또는 valid', default: 'dev' }
      issue: { description: '결과를 댓글로 남길 Issue 번호(선택)', default: '' }
permissions:
  contents: read
  issues: write
concurrency:
  group: lab-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRATEGY: ${{ inputs.strategy }}
          PERIOD: ${{ inputs.period }}
        run: |
          set -o pipefail  # tee가 파이썬 실패를 가리지 않게
          python -m quant.lab.cli "$STRATEGY" --period "$PERIOD" | tee "$RUNNER_TEMP/card.md"
          cat "$RUNNER_TEMP/card.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the Issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "Issue 번호가 아님"; exit 0; }
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/card.md"

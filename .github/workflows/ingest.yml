name: ingest
# 매일 수집(한국 시세 T+1 13시 이후 반영 → 한국시간 14:37). 키가 없는 소스는 건너뛴다.
on:
  schedule:
    # GitHub 예약은 붐비면 몇 시간씩 밀리거나 빠진다(11/26: 10시간 지연) → 두 번 걸어 하루 한 번은 확실히.
    # 두 번째는 이미 받은 날짜를 건너뛰어 가볍고, AI 브리프는 같은 데이터면 다시 쓰지 않는다.
    - cron: '37 5 * * *'
    - cron: '7 9 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '며칠 전까지 다시 받을지'
        default: '5'
      sources:
        description: '소스만 고르기(쉼표: tiingo,fred,data.go.kr,finnhub,sec). 빈칸=전부'
        default: ''
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt
      - name: Migrate (DB가 있을 때만, 모두 if not exists)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL 없음 — 건너뜀"; exit 0; fi
          for f in $(ls db/migrations/*.sql | sort); do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
          SOURCES: ${{ inputs.sources || '' }}
        run: python -m quant.ingest.run --days "${{ inputs.days || '5' }}" --sources "$SOURCES"
      - name: Snapshot for app (DB가 있을 때만)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m quant.snapshot
